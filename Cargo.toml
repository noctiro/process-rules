[package]
name = "process-rules"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
description = "Generate cross-platform, region-aware PROCESS-NAME rules for Mihomo"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["mihomo", "process", "proxy", "ruleset", "cli"]
categories = ["command-line-utilities", "config"]
default-run = "process-rules"

[[bin]]
name = "process-rules"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# Keep dependency capabilities explicit so new upstream defaults cannot silently
# enlarge the cross-platform release artifacts.
clap = { version = "4.6.6", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "0.11.0", default-features = false }
tempfile = { version = "3.27.0", default-features = false, features = ["getrandom"] }
thiserror = { version = "2.0.20", default-features = false, features = ["std"] }
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde", "std"] }
unicase = { version = "2.9.0", default-features = false }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# Actionable dependency checks from Clippy's Cargo group. The metadata and
# transitive-version lints are intentionally not enabled until they can pass
# without exceptions.
negative_feature_names = "warn"
redundant_feature_names = "warn"
wildcard_dependencies = "warn"

dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

# Published binaries favor distribution size; rule generation is primarily I/O-bound.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "z"
panic = "abort"
strip = "symbols"
