name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust MSRV
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Select Rust MSRV
        run: rustup default 1.98.0

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Lint all targets
        if: runner.os == 'Linux'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-features

      - name: Validate repository rules
        run: cargo run --locked -- validate
